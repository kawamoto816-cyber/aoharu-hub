# 承認済み台本 ([shorts] ブロック) からショート動画を自動生成し、Supabase Storage に置いてサーバーに記録する。
#   スケジュール (2026-10 変更): 17:30 JST と、予備の 22:30 JST の1日2回。
#     GitHub Actions のスケジュール実行は数時間遅れることがある (指標の書き出しで約2時間の遅れを確認済み)。
#     以前の 20:30 JST 1回だけの設定では、遅れて0時をまたいだ日に「翌日」のキューを見て0本で終わっていた。
#     承認済み投稿は朝に揃っているので前倒しし、予備の実行と「今日と昨日の両方を見る」処理で取りこぼしを防ぐ。
#     生成済みの台本は飛ばすので、2回走っても同じ動画を二度作らない。
#   生成した動画は、run-queue (10:03 / 13:03 / 20:03 JST) が YouTube・Instagram に1本ずつ投稿する。
#   手動実行も可 (date で日付指定。空なら今日と昨日)。
#   必要な Secrets: CRON_SECRET, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY。Variables: SHORTS_SPEAKER (任意)
name: shorts-auto
on:
  schedule:
    - cron: "30 8 * * *"   # 17:30 JST
    - cron: "30 13 * * *"  # 22:30 JST (予備。遅延・失敗の取りこぼし用)
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 (YYYY-MM-DD, JST)。空なら今日と昨日"
        default: ""
concurrency:
  group: shorts-auto
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk python3-pil > /dev/null
      - name: Wait for VOICEVOX
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:50021/version > /dev/null; then echo "voicevox ready"; exit 0; fi
            sleep 3
          done
          echo "voicevox not ready"; exit 1
      - name: Render approved scripts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHORTS_SPEAKER: ${{ vars.SHORTS_SPEAKER }}
          SHORTS_DATE: ${{ github.event.inputs.date }}
        run: bash scripts/shorts/run_queue.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-auto
          path: out/
          retention-days: 14
