# 承認済み台本 ([shorts] ブロック) からショート動画を自動生成し、Supabase Storage に置いてサーバーに記録する。
#   スケジュール: 月・水・金 20:30 JST (11:30 UTC)。手動実行も可 (date で日付指定)。
#   必要な Secrets: CRON_SECRET, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY。Variables: SHORTS_SPEAKER (任意)
name: shorts-auto
on:
  schedule:
    - cron: "30 11 * * 1,3,5"
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 (YYYY-MM-DD, JST)。空なら今日"
        default: ""
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk python3-pil > /dev/null
      - name: Wait for VOICEVOX
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:50021/version > /dev/null; then echo "voicevox ready"; exit 0; fi
            sleep 3
          done
          echo "voicevox not ready"; exit 1
      - name: Render approved scripts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHORTS_SPEAKER: ${{ vars.SHORTS_SPEAKER }}
          SHORTS_DATE: ${{ github.event.inputs.date }}
        run: bash scripts/shorts/run_queue.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-auto
          path: out/
          retention-days: 14
