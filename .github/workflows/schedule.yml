# アオハルOS 定時処理 (サーバーへのHTTP呼び出しは、すべてここから行う)
#   - 04:00 JST 指標レポートを Google ドキュメントに書き出す (アナリスト 08:00 / 編集長 08:30 が読む)
#     (2026-09-20: GitHub Actions のスケジュール実行が「07:40 JST」設定に対して
#      毎日ほぼ一定して2時間前後遅延する事象を確認したため、遅延を吸収できるよう
#      実行時刻を前倒しした。元は "40 22 * * *" = 07:40 JST 設定だった)
#   - 10:03 / 13:03 / 20:03 JST 承認済み投稿を投稿 (Vercel Cron 10:03 / 20:03 と二重化。冪等なので安全)
#   - 09:30 JST (平日) 法人営業の「送信承認」分をメール送信 (冪等)
#   - 12:00 JST SEO記事エージェントがドライブに書いた記事を /guide に取り込む
#   - 13:00 JST 法人営業の「返信記録」を取り込み、返信・面談を記録する
#   - 3時間おき 法人営業の見込み先をGoogle Places APIで少しずつ拾う (sales_leads に積む)
#   - 05:50 JST 拾った見込み先をテンプレートで提案文まで組み立てて「テンプレート提案」に書き出す
#     (法人営業エージェントの06:30実行より前に終える)
#   - 月曜 03:00 JST Threads / Instagram の長期トークンを更新 (60日で失効するため)
# 必要な Secret: CRON_SECRET (Vercel の環境変数と同じ値)
#
# 重要: Claude の「スケジュール済みタスク」からは本番ドメインを叩かないこと。
# あちらの実行環境は外部通信が許可制で、app.bluespring.co.jp への接続が拒否される
# (403 CONNECT tunnel failed)。サーバー処理の定期実行はこのワークフローの責任範囲。
name: scheduled-jobs
on:
  schedule:
    - cron: "0 19 * * *"    # 04:00 JST 指標レポート (遅延を見込んで前倒し。詳細は冒頭コメント)
    - cron: "3 1 * * *"     # 10:03 JST 朝枠
    - cron: "3 4 * * *"     # 13:03 JST 昼枠
    - cron: "3 11 * * *"    # 20:03 JST 夜枠
    - cron: "30 0 * * 1-5"  # 09:30 JST 平日 法人営業の送信承認分を送信
    - cron: "0 3 * * *"     # 12:00 JST SEO記事の取り込み
    - cron: "0 4 * * *"     # 13:00 JST 法人営業の返信記録の取り込み
    - cron: "15 */3 * * *"  # 3時間おき 見込み先のハーベスト (Google Places API)
    - cron: "50 20 * * *"   # 05:50 JST テンプレート提案の書き出し (エージェント実行前)
    - cron: "0 18 * * 0"    # 月曜 03:00 JST Threads/Instagram トークン更新
  workflow_dispatch:
    inputs:
      job:
        description: "metrics | run-queue | sales | refresh-tokens | guide-ingest | sales-replies-ingest | sales-leads-harvest | sales-leads-candidates"
        default: "run-queue"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide job
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ github.event.inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 19 * * *" ]; then
            echo "job=metrics" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 0 * * 1-5" ]; then
            echo "job=sales" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 3 * * *" ]; then
            echo "job=guide-ingest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then
            echo "job=sales-replies-ingest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 */3 * * *" ]; then
            echo "job=sales-leads-harvest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "50 20 * * *" ]; then
            echo "job=sales-leads-candidates" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 18 * * 0" ]; then
            echo "job=refresh-tokens" >> "$GITHUB_OUTPUT"
          else
            echo "job=run-queue" >> "$GITHUB_OUTPUT"
          fi
      - name: Call production
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret is not set"; exit 1; fi
          if [ "${{ steps.pick.outputs.job }}" = "metrics" ]; then
            url="https://app.bluespring.co.jp/internal/metrics/publish"
          elif [ "${{ steps.pick.outputs.job }}" = "sales" ]; then
            url="https://app.bluespring.co.jp/internal/sales/run"
          elif [ "${{ steps.pick.outputs.job }}" = "guide-ingest" ]; then
            url="https://app.bluespring.co.jp/internal/guide/ingest"
          elif [ "${{ steps.pick.outputs.job }}" = "sales-replies-ingest" ]; then
            url="https://app.bluespring.co.jp/internal/sales/replies/ingest?all=1"
          elif [ "${{ steps.pick.outputs.job }}" = "sales-leads-harvest" ]; then
            url="https://app.bluespring.co.jp/internal/sales/leads/harvest"
          elif [ "${{ steps.pick.outputs.job }}" = "sales-leads-candidates" ]; then
            url="https://app.bluespring.co.jp/internal/sales/leads/candidates"
          elif [ "${{ steps.pick.outputs.job }}" = "refresh-tokens" ]; then
            url="https://app.bluespring.co.jp/internal/social/refresh-threads"
          else
            url="https://app.bluespring.co.jp/internal/social/run-queue"
          fi
          for i in 1 2 3; do
            code=$(curl -sS -o out.json -w '%{http_code}' --max-time 150 -H "Authorization: Bearer $CRON_SECRET" "$url") && break || true
            echo "attempt $i failed (HTTP $code)"; sleep 60
          done
          echo "HTTP $code"; cat out.json; echo
          [ "$code" = "200" ]
